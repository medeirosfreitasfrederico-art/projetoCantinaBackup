<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cantina Online - Pagamento</title>
    <link rel="stylesheet" href="/src/main/resources/static/style.css">
</head>
<body>
    <header>
        <div class="logo">Cantina Online</div>
        <button class="theme-toggle" onclick="toggleDarkMode()">🌙</button>
    </header>
    
    <div class="container">
        <div class="card">
            <h2>Pagamento</h2>
            
            <div class="form-group">
                <label>Forma de Pagamento</label>
                <select id="payment-method" class="form-control">
                    <option value="cash"></option>
                    <option value="card">Cartão</option>
                    <option value="pix">PIX</option>
                </select>
            </div>
            
            <div id="card-fields" style="display: none;">
                <div class="form-group">
                    <label>Número do Cartão</label>
                    <input type="text" class="form-control" placeholder="0000 0000 0000 0000">
                </div>
                <div class="form-group">
                    <label>Nome no Cartão</label>
                    <input type="text" class="form-control" placeholder="Como consta no cartão">
                </div>
                <div class="form-group">
                    <label>Validade</label>
                    <input type="text" class="form-control" placeholder="MM/AA">
                </div>
                <div class="form-group">
                    <label>CVV</label>
                    <input type="text" class="form-control" placeholder="000">
                </div>
            </div>
            
            <button class="btn btn-primary" onclick="processPayment()">Confirmar Pagamento</button>
            <a href="carrinho.html" class="btn btn-secondary">Voltar</a>
            <a href="javascript:void(0)" onclick="limparAovoltarInicio()" class="btn btn-secondary">Voltar ao Início</a>
        </div>
    </div>

    <script src="/src/main/resources/static/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const paymentMethod = document.getElementById('payment-method');
            const cardFields = document.getElementById('card-fields');
            
            paymentMethod.addEventListener('change', function() {
                cardFields.style.display = this.value === 'card' ? 'block' : 'none';
            });
            
            const cart = JSON.parse(localStorage.getItem('cart') || '[]');
            if (cart.length === 0) {
                window.location.href = 'produtos.html';
            }
        });
    </script>
</body>
</html>
