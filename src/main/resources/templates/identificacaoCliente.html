<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cantina Online - Identificação</title>
    <link rel="stylesheet" href="/src/main/resources/static/style.css">
</head>
<body>
    <header>
        <div class="logo">Cantina Online</div>
        <button class="theme-toggle" onclick="toggleDarkMode()">🌙</button>
    </header>
    
    <div class="container">
        <div class="card">
            <h2>Identifique-se</h2>
            <p>Digite seu nome para continuar com o pedido:</p>
            
            <div class="form-group">
                <input type="text" id="customer-name" class="form-control" placeholder="Seu nome">
            </div>
            
            <!-- 🔥 MUDANÇA CRÍTICA: type="button" e prevenir submit -->
            <button type="button" class="btn btn-primary" onclick="setCustomerName(event)">Continuar</button>
            <a href="index.html" class="btn btn-secondary">Voltar</a>
        </div>
    </div>

    <!-- 🔥 MUDANÇA CRÍTICA: Caminho correto do JavaScript -->
    <script src="/src/main/resources/static/app.js"></script>
</body>
</html>
