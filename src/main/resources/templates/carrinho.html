<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cantina Online - Carrinho</title>
    <link rel="stylesheet" href="/src/main/resources/static/style.css">
</head>
<body>
    <header>
        <div class="logo">Cantina Online</div>
        <button class="theme-toggle" onclick="toggleDarkMode()">🌙</button>
    </header>
    
    <div class="container">
        <div class="card">
            <h2>Seu Carrinho</h2>
            
            <div id="cart-items">
                <!-- Itens do carrinho serão carregados aqui via JavaScript -->
            </div>
            
            <div class="cart-total" id="cart-total">
                Total: R$ 0,00
            </div>
            
            <div style="margin-top: 20px;">
                <a href="javascript:void(0)" onclick="limparAovoltarInicio()" class="btn btn-secondary">Voltar ao Início</a>
                <a href="pagamento.html" class="btn btn-primary">Finalizar Pedido</a>
                <a href="produtos.html" class="btn btn-secondary">Continuar Comprando</a>
            </div>
        </div>
    </div>

    <script src="/src/main/resources/static/app.js"></script>
    <script>
        // Atualizar carrinho quando a página for carregada
        document.addEventListener('DOMContentLoaded', function() {
            updateCart();
        });
    </script>
</body>
</html>
