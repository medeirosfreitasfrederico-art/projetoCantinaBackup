<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cantina Online - Adicionar Produto</title>
    <link rel="stylesheet" href="/src/main/resources/static/style.css">
</head>
<body>
    <header style="padding-bottom: 3%;">
        <div class="logo">Cantina Online - Área do Vendedor</div>
        <div class="vendedor-info">
            Olá, <span id="vendedor-nome">Administrador</span>
        </div>
        <div style="position: absolute; right: 20px; top: 15px;">
            <button class="theme-toggle" onclick="toggleDarkMode()" style="margin-right: 10px; top: 0px">🌙</button>
            <button class="btn btn-secondary" onclick="fazerLogout()" style="padding: 5px 10px; font-size: 14px;">Sair</button>
        </div>
        <div class="form-group">
            <label>Estoque</label>
            <input type="number" id="product-estoque" class="form-control" value="0" min="0">
        </div>
    </header>
    
    <div class="container">
        <div class="card">
            <h2>Adicionar Produto</h2>
            
            <div class="form-group">
                <label>Nome do Produto</label>
                <input type="text" id="product-name" class="form-control">
            </div>
            
            <div class="form-group">
                <label>Descrição</label>
                <textarea id="product-description" class="form-control" rows="3"></textarea>
            </div>
            
            <div class="form-group">
                <label>Preço (R$)</label>
                <input type="number" id="product-price" class="form-control" step="0.01">
            </div>
            
            <div class="form-group">
                <label>Imagem do Produto</label>
                <input type="file" id="product-image" class="form-control">
            </div>
            
            <button class="btn btn-primary" onclick="addProduct()">Salvar Produto</button>
            <a href="gerenciarProdutos.html" class="btn btn-secondary">Cancelar</a>
        </div>
    </div>

    <script src="/src/main/resources/static/app.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', function() {
    if (!verificarAutenticacao()) {
        alert('Você precisa fazer login para acessar esta área.');
    } else {
        carregarNomeVendedor(); 
    }
});
    </script>
</body>
</html>
