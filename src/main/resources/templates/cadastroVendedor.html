<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cantina Online - Cadastro de Vendedor</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
    <header>
        <div class="logo">Cantina Online</div>
        <button class="theme-toggle" onclick="toggleDarkMode()">🌙</button>
    </header>

    <div class="container">
        <div class="card">
            <h2>Cadastro de Vendedor</h2>
            
            <form th:action="@{/auth/cadastro}" method="post">
                <div th:if="${error}" class="alert alert-danger">
                    <p th:text="${error}"></p>
                </div>
                <div th:if="${success}" class="alert alert-success">
                    <p th:text="${success}"></p>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="nome">Nome Completo *</label>
                        <input type="text" id="nome" name="nome" class="form-control" required>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="usuario">Usuário *</label>
                        <input type="text" id="usuario" name="usuario" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="cpf">CPF *</label>
                        <input type="text" id="cpf" name="cpf" class="form-control" placeholder="000.000.000-00" required>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="email">E-mail *</label>
                        <input type="email" id="email" name="email" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="telefone">Telefone</label>
                        <input type="tel" id="telefone" name="telefone" class="form-control" placeholder="(00) 00000-0000">
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="senha">Senha *</label>
                        <input type="password" id="senha" name="senha" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="confirmar-senha">Confirmar Senha *</label>
                        <input type="password" id="confirmar-senha" name="confirmar-senha" class="form-control" required>
                    </div>
                </div>
                
                <div class="security-questions">
                    <h3>Perguntas de Segurança</h3>
                    <p>Selecione e responda duas perguntas para recuperação de senha:</p>
                    
                    <div class="question-group">
                        <label for="pergunta1">Primeira Pergunta *</label>
                        <select id="pergunta1" name="pergunta1" class="form-control" required>
                            <option value="">Selecione uma pergunta</option>
                            <option value="Nome do seu primeiro animal de estimação">Nome do seu primeiro animal de estimação</option>
                            <option value="Nome da sua mãe/pai">Nome da sua mãe solteira</option>
                            <option value="Cidade onde você nasceu">Cidade onde você nasceu</option>
                            <option value="Nome do seu melhor amigo de infância">Nome do seu melhor amigo de infância</option>
                            <option value="Modelo do seu primeiro carro">Modelo do seu primeiro carro</option>
                            <option value="Nome da sua primeira escola">Nome da sua primeira escola</option>
                        </select>
                        <input type="text" id="resposta1" name="resposta1" class="form-control" placeholder="Resposta" required>
                    </div>
                    
                    <div class="question-group">
                        <label for="pergunta2">Segunda Pergunta *</label>
                        <select id="pergunta2" name="pergunta2" class="form-control" required>
                            <option value="">Selecione uma pergunta</option>
                            <option value="Nome do seu primeiro professor">Nome do seu primeiro professor</option>
                            <option value="Comida favorita na infância">Comida favorita na infância</option>
                            <option value="Apelido de infância">Apelido de infância</option>
                            <option value="Time de futebol do coração">Time de futebol do coração</option>
                            <option value="Primeiro filme que assistiu no cinema">Primeiro filme que assistiu no cinema</option>
                            <option value="Nome do seu personagem favorito">Nome do seu personagem favorito</option>
                        </select>
                        <input type="text" id="resposta2" name="resposta2" class="form-control" placeholder="Resposta" required>
                    </div>
                </div>
                
                <div style="margin-top: 20px;">
                    <button type="submit" class="btn btn-primary">Cadastrar</button>
                    <a th:href="@{/auth/login}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
    <script th:src="@{/app.js}"></script>
</body>
</html>
