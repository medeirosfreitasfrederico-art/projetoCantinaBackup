<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cantina Online - Editar Produto</title>
    <link rel="stylesheet" href="/src/main/resources/static/style.css">
</head>
<body>
    <header style="padding-bottom: 3%;">
        <div class="logo">Cantina Online - Área do Vendedor</div>
        <div class="vendedor-info">
            Olá, <span id="vendedor-nome">Administrador</span>
        </div>
        <div style="position: absolute; right: 20px; top: 15px;">
            <button class="theme-toggle" onclick="toggleDarkMode()" style="margin-right: 10px; top: 0px">🌙</button>
            <button class="btn btn-secondary" onclick="fazerLogout()" style="padding: 5px 10px; font-size: 14px;">Sair</button>
        </div>
    </header>
    
    <div class="container">
        <div class="card">
            <h2>Editar Produto</h2>
            
            <div id="loading-message" class="loading">Carregando produto...</div>
            
            <div id="product-form" style="display: none;">
                <div class="form-group">
                    <label>Nome do Produto *</label>
                    <input type="text" id="product-name" class="form-control">
                </div>
                
                <div class="form-group">
                    <label>Descrição *</label>
                    <textarea id="product-description" class="form-control" rows="3"></textarea>
                </div>
                
                <div class="form-group">
                    <label>Preço (R$) *</label>
                    <input type="number" id="product-price" class="form-control" step="0.01">
                </div>
                
                <div class="form-group">
                    <label>Estoque</label>
                    <input type="number" id="product-estoque" class="form-control" value="0" min="0">
                </div>
                
                <!-- 🖼️ Seção de Imagem -->
                <div class="form-group">
                    <label>Imagem do Produto</label>
                    <div id="image-upload-area">
                        <input type="file" id="product-image" class="form-control" accept="image/*" style="display: none;">
                        <div id="image-preview-container" style="display: none;">
                            <img id="image-preview" style="max-width: 200px; max-height: 200px; margin: 10px 0; border-radius: 5px;">
                            <button type="button" onclick="removerImagem()" class="btn btn-secondary" style="margin-left: 10px;">Remover</button>
                        </div>
                        <button type="button" onclick="document.getElementById('product-image').click()" class="btn btn-secondary">
                            📷 Alterar Imagem
                        </button>
                        <div id="upload-progress" style="display: none; margin-top: 10px;">
                            <div style="background: #f0f0f0; border-radius: 5px; height: 20px;">
                                <div id="progress-bar" style="background: var(--primary-color); height: 100%; width: 0%; border-radius: 5px; transition: width 0.3s;"></div>
                            </div>
                            <div id="progress-text" style="text-align: center; margin-top: 5px;">0%</div>
                        </div>
                    </div>
                </div>
                
                <button class="btn btn-primary" onclick="atualizarProduto()">Salvar Alterações</button>
                <a href="gerenciarProdutos.html" class="btn btn-secondary">Cancelar</a>
            </div>
            
            <div id="error-message" style="display: none;" class="error">
                Erro ao carregar produto.
            </div>
        </div>
    </div>

    <script src="/src/main/resources/static/app.js"></script>
    <script>
        let produtoAtual = null;

        document.addEventListener('DOMContentLoaded', function() {
            if (!verificarAutenticacao()) {
                showAlert('Você precisa fazer login para acessar esta área.', 'error');
                window.location.href = 'loginVendedor.html';
                return;
            }
            carregarNomeVendedor();
            carregarProdutoParaEdicao();

            // Listener para mostrar o preview da nova imagem selecionada
            document.getElementById('product-image').addEventListener('change', function(event) {
                const file = event.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const preview = document.getElementById('image-preview');
                        preview.src = e.target.result;
                        document.getElementById('image-preview-container').style.display = 'flex';
                    }
                    reader.readAsDataURL(file);
                }
            });
        });

        async function carregarProdutoParaEdicao() {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                const produtoId = urlParams.get('id');
                
                if (!produtoId) {
                    mostrarErro('ID do produto não especificado.');
                    return;
                }

                const response = await fetch(`http://localhost:8080/api/produtos/${produtoId}`);
                if (!response.ok) {
                    throw new Error('Produto não encontrado');
                }

                const produto = await response.json();
                produtoAtual = produto;
                
                // Preencher formulário
                document.getElementById('product-name').value = produto.nome;
                document.getElementById('product-description').value = produto.descricao;
                document.getElementById('product-price').value = produto.preco;
                document.getElementById('product-estoque').value = produto.estoque || 0;
                
                // Mostrar imagem atual, se existir
                if (produto.imagem) {
                    const preview = document.getElementById('image-preview');
                    preview.src = `/uploads/${produto.imagem}`; // Caminho correto
                    document.getElementById('image-preview-container').style.display = 'flex';
                }
                
                document.getElementById('loading-message').style.display = 'none';
                document.getElementById('product-form').style.display = 'block';
                
            } catch (error) {
                console.error('Erro ao carregar produto:', error);
                mostrarErro('Erro ao carregar produto: ' + error.message);
            }
        }

        async function atualizarProduto() {
            if (!produtoAtual) return;
            
            const nome = document.getElementById('product-name').value.trim();
            const descricao = document.getElementById('product-description').value.trim();
            const preco = parseFloat(document.getElementById('product-price').value);
            const estoque = parseInt(document.getElementById('product-estoque').value) || 0;
            const imagemInput = document.getElementById('product-image');
            const novaImagem = imagemInput.files[0];

            // Validações
            if (!nome || !descricao || isNaN(preco) || preco <= 0) {
                showAlert('Por favor, preencha todos os campos obrigatórios corretamente.', 'error');
                return;
            }
            
            try {
                showAlert('Atualizando produto...', 'info');
                
                const formData = new FormData();
                formData.append('nome', nome);
                formData.append('descricao', descricao);
                formData.append('preco', preco);
                formData.append('estoque', estoque);

                if (novaImagem) {
                    formData.append('imagem', novaImagem);
                }
                
                const response = await fetch(`http://localhost:8080/api/produtos/${produtoAtual.id}`, {
                    method: 'PUT',
                    body: formData // Envia como multipart/form-data
                });
                
                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({ message: 'Erro desconhecido no servidor.' }));
                    throw new Error(errorData.message || `Erro HTTP: ${response.status}`);
                }
                
                const data = await response.json();
                
                if (data.success) {
                    showAlert('Produto atualizado com sucesso!', 'success');
                    setTimeout(() => {
                        window.location.href = 'gerenciarProdutos.html';
                    }, 1500);
                } else {
                    showAlert('Erro ao atualizar produto: ' + data.message, 'error');
                }
                
            } catch (error) {
                console.error('Erro ao atualizar produto:', error);
                showAlert('Erro ao conectar com o servidor: ' + error.message, 'error');
            }
        }

        function mostrarErro(mensagem) {
            document.getElementById('loading-message').style.display = 'none';
            const errorDiv = document.getElementById('error-message');
            errorDiv.style.display = 'block';
            errorDiv.textContent = mensagem;
        }

        function removerImagem() {
            // Esta função pode ser usada para marcar uma imagem para remoção no futuro
            // Por enquanto, apenas limpa o preview e o input
            document.getElementById('product-image').value = '';
            const preview = document.getElementById('image-preview');
            preview.src = '';
            document.getElementById('image-preview-container').style.display = 'none';
            showAlert('A imagem será removida ao salvar.', 'info');
            // Para deletar a imagem do servidor, uma lógica adicional seria necessária no backend
        }
    </script>
</body>
</html>
