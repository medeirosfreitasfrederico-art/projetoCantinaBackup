<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cantina Online - Produtos</title>
    <link rel="stylesheet" href="/src/main/resources/static/style.css">
</head>
<body>
    <header>
        <div class="logo">Cantina Online</div>
        <button class="theme-toggle" onclick="toggleDarkMode()">🌙</button>
    </header>
    
    <div class="container">
        <div class="card">
            <h2>Faça seu pedido</h2>
            <p>Olá, <span id="customer-name-display"></span>! Selecione os produtos desejados:</p>
            
            <div class="product-grid" id="products-grid">
                <!-- Produtos serão carregados aqui via JavaScript -->
            </div>
            
            <div style="text-align: right; margin-top: 20px;">
                <a href="carrinho.html" class="btn btn-primary">Ver Carrinho</a>
                <a href="index.html" class="btn btn-secondary">Voltar</a>
            </div>
        </div>
    </div>

    <script src="/src/main/resources/static/app.js"></script>
    <script>
        //carregar produtos
        document.addEventListener('DOMContentLoaded', function() {
            loadProducts();

            //salvar nome
            const customerName = localStorage.getItem('customerName');
            if (customerName) {
                document.getElementById('customer-name-display').textContent = customerName;
            } else {
                window.location.href = 'identificacaoCliente.html';
            }
        });
    </script>
</body>
</html>
